<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <script>
    // Redirect to index.html and preserve the route in the hash
    const path = window.location.pathname;
    const search = window.location.search;
    // Store the path so the app can navigate to it
    sessionStorage.redirect = path + search;
    // Redirect to index.html
    window.location.href = '/index.html';
  </script>
</head>
<body>
</body>
</html>
